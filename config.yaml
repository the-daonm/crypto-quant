exchange: binance          # đổi sang okx / bybit nếu Binance bị chặn
symbols: [BTC/USDT, ETH/USDT, SOL/USDT]
timeframes: [1d, 4h]
since: "2019-01-01"

fee: 0.001                 # 0.1% mỗi lần đổi vị thế
threshold: 0.5             # ngưỡng xác suất mặc định để vào lệnh

walk_forward:
  train_min: {1d: 730, 4h: 4380}   # số nến train tối thiểu (~2 năm)
  test_size: {1d: 90, 4h: 540}     # số nến mỗi fold test (~3 tháng)
  gap: 1                            # embargo giữa train và test
