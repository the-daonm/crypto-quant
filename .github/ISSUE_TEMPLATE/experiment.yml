name: 🧪 Experiment
description: Test a new idea for the model or strategy (features, models, sizing, …)
labels: ["experiment"]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: What do you expect, and why (economic or statistical rationale)?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Experiment design
      description: Which variants are compared against the current configuration? Pairs, timeframes, metrics?
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Methodology checklist
      options:
        - label: Evaluate and select using the design period only (before `holdout_start`)
          required: true
        - label: Report results after fees and compare against Buy & Hold
          required: true
        - label: Record the number of configurations tried
          required: true
  - type: textarea
    id: result
    attributes:
      label: Results (fill in when done)
      description: Tables or charts with commentary. Negative results are valuable too.
