name: 🐛 Bug report
description: Something crashes, behaves incorrectly, or produces implausible results
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Command you ran, configuration (`config.yaml`), pair and timeframe.
      placeholder: |
        python -m cq.pipeline --symbol BTC/USDT --tf 4h --band 0.05
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Python version, commit hash (git rev-parse --short HEAD)"
