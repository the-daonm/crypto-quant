[project]
name = "crypto-quant"
version = "0.2.0"
description = "Crypto price-direction prediction with classical ML and fee-aware walk-forward backtesting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["crypto", "quant", "machine-learning", "backtesting", "walk-forward", "lightgbm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ccxt",
    "pandas",
    "numpy",
    "scikit-learn",
    "lightgbm",
    "xgboost",
    "streamlit",
    "plotly",
    "pyarrow",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.17.4"]
notebook = ["jupyter", "matplotlib", "tabulate"]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/the-daonm/crypto-quant"
Issues = "https://github.com/the-daonm/crypto-quant/issues"
Documentation = "https://the-daonm.github.io/crypto-quant/"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
